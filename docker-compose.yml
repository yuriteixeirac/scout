services:
  redis:
    image: redis:alpine
    ports:
      - 6379:6379

  app:
    build: ./
    ports:
      - 8080:8080
    depends_on:
      - redis
    environment:
      - REDIS_SERVER=${REDIS_SERVER}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PROTOCOL=${REDIS_PROTOCOL}
